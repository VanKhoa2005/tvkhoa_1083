<!DOCTYPE html>
<html lang="en">
<head>
    <title>Playfair Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <table class="table">
            <!-- Tiêu đề -->
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">PLAYFAIR CIPHER</td>
            </tr>

            <!-- Phần mã hóa -->
            <tr>
                <td style="font-weight: bold; color: blue;">ENCRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="playfair/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="text" class="form-control" name="inputKeyPlain" placeholder="Input Key" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                        <div class="mb-3 mt-3" id="resultEncryptContainer" style="display: none;">
                            <label class="form-label" style="font-weight: bold; color: blue;">Result:</label>
                            <input type="text" class="form-control" id="resultEncrypt" readonly>
                        </div>
                    </form>
                </td>
            </tr>

            <!-- Phần giải mã -->
            <tr>
                <td style="font-weight: bold; color: rgb(255, 0, 0);">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="playfair/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="text" class="form-control" name="inputKeyCipher" placeholder="Input Key" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Decrypt</button>
                        <div class="mb-3 mt-3" id="resultDecryptContainer" style="display: none;">
                            <label class="form-label" style="font-weight: bold; color: red;">Result:</label>
                            <input type="text" class="form-control" id="resultDecrypt" readonly>
                        </div>
                    </form>
                </td>
            </tr>

            <!-- Phần ma trận -->
            <tr id="matrixContainerRow" style="display: none;">
                <td>
                    <div class="mb-3 mt-3 text-center">
                        <label class="form-label" style="font-weight: bold; color: rgb(128, 0, 128);">PLAYFAIR KEY MATRIX (5x5):</label>
                        <table class="table table-bordered" style="max-width: 250px; margin: 10px auto; text-align: center; font-weight: bold;">
                            <tbody id="matrixBody">
                            </tbody>
                        </table>
                    </div>
                </td>
            </tr>

            <td>
                <a href="http://127.0.0.1:5050/">
                    <button class= "btn btn-primary " >Quay ve trang chu hehe </button>
                </a>
            </td>
        </table>
    </div>

    <script>
    document.querySelectorAll('form').forEach(form => {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const action = this.getAttribute('action');
            
            fetch(action, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (action.includes('encrypt')) {
                    document.getElementById('resultEncrypt').value = data.result;
                    document.getElementById('resultEncryptContainer').style.display = 'block';
                    
                    const cipherInput = document.querySelector('input[name="inputCipherText"]');
                    if (cipherInput) cipherInput.value = data.result;
                    const keyInput = document.querySelector('input[name="inputKeyCipher"]');
                    if (keyInput) keyInput.value = data.key;
                } else {
                    document.getElementById('resultDecrypt').value = data.result;
                    document.getElementById('resultDecryptContainer').style.display = 'block';
                    
                    const plainInput = document.querySelector('input[name="inputPlainText"]');
                    if (plainInput) plainInput.value = data.result;
                    const keyInput = document.querySelector('input[name="inputKeyPlain"]');
                    if (keyInput) keyInput.value = data.key;
                }

                // Render Playfair Matrix
                if (data.matrix) {
                    const matrixBody = document.getElementById('matrixBody');
                    let html = '';
                    for (let r = 0; r < 5; r++) {
                        html += '<tr>';
                        for (let c = 0; c < 5; c++) {
                            html += `<td>${data.matrix[r][c]}</td>`;
                        }
                        html += '</tr>';
                    }
                    matrixBody.innerHTML = html;
                    document.getElementById('matrixContainerRow').style.display = 'table-row';
                }
            })
            .catch(err => console.error(err));
        });
    });
    </script>
</body>
</html>
